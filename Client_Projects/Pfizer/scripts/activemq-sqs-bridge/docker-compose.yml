# Local end-to-end test stack: ActiveMQ 5.15 + LocalStack SQS + both bridges.
#   docker compose up --build
# For real environments mount ingestion.yaml and pass --env; sqs-to-amq uses its env file.
services:
  activemq:
    image: rmohr/activemq:5.15.9
    ports:
      - "61616:61616"   # OpenWire
      - "8161:8161"     # Web console (admin/admin)

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./local/localstack-init:/etc/localstack/init/ready.d:ro

  amq-to-sqs:
    build:
      context: .
      dockerfile: amq-to-sqs/Dockerfile
    depends_on: [activemq, localstack]
    restart: unless-stopped
    command: ["--env", "DEV"]
    environment:
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_OVERRIDE: http://localstack:4566
      INGESTION_CONFIG: /etc/bridge/ingestion.yaml
    volumes:
      - ./config/local-ingestion.yaml:/etc/bridge/ingestion.yaml:ro

  sqs-to-amq:
    build:
      context: .
      dockerfile: sqs-to-amq/Dockerfile
    depends_on: [activemq, localstack]
    restart: unless-stopped
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_OVERRIDE: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/exception-out
